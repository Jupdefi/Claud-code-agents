name: Stale Issue and PR Management

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-issues:
    name: Mark and Close Stale Issues
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            👋 This issue has been automatically marked as stale because it has not had recent activity.

            **Why is this marked as stale?**
            - No activity for 60 days
            - Helps us keep the issue tracker organized
            - Ensures active issues get attention

            **What happens next?**
            - This issue will be closed in 14 days if no further activity occurs
            - You can prevent closure by:
              - Adding a comment with updates
              - Providing additional information
              - Confirming the issue still exists

            **If this issue is still relevant:**
            Please add a comment explaining:
            - Current status or workarounds
            - Why this should remain open
            - Any new information

            Thank you for your contributions! 🙏

          close-issue-message: |
            🔒 This issue has been automatically closed due to inactivity.

            **Why was this closed?**
            - No activity for 74+ days (60 days stale + 14 days warning)
            - Helps maintain an organized issue tracker

            **Not resolved?**
            - Feel free to reopen if you can provide additional information
            - Create a new issue with updated details
            - Reference this issue number in the new issue

            **Was this closed by mistake?**
            - Comment below and a maintainer will review
            - We can reopen if still relevant

            Thank you for understanding! 🙏

          stale-issue-label: 'stale'
          close-issue-label: 'auto-closed'
          exempt-issue-labels: 'pinned,security,roadmap,help-wanted,good-first-issue'

          # PR settings
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-message: |
            👋 This pull request has been automatically marked as stale because it has not had recent activity.

            **Why is this marked as stale?**
            - No activity for 45 days
            - May need rebasing or updates
            - Helps us focus on active contributions

            **What happens next?**
            - This PR will be closed in 14 days if no further activity occurs
            - You can prevent closure by:
              - Pushing new commits
              - Responding to review comments
              - Rebasing on the latest main branch

            **Still working on this?**
            Please add a comment to let us know:
            - Your progress status
            - If you need help
            - Expected completion timeline

            **Need assistance?**
            - Ask questions in the PR comments
            - Check our [Contributing Guide](.github/CONTRIBUTING.md)
            - Request help in [Discussions](../../discussions)

            We appreciate your contribution! 🙏

          close-pr-message: |
            🔒 This pull request has been automatically closed due to inactivity.

            **Why was this closed?**
            - No activity for 59+ days (45 days stale + 14 days warning)
            - Likely needs significant rebasing or updates

            **Want to continue this work?**
            - Reopen this PR if you're ready to continue
            - Create a new PR with updated changes
            - Reference this PR number in the new one

            **Was this closed by mistake?**
            - Comment below to request reopening
            - A maintainer will review and assist

            Thank you for your effort! We hope to see your contributions again. 💙

          stale-pr-label: 'stale'
          close-pr-label: 'auto-closed'
          exempt-pr-labels: 'pinned,security,in-progress,needs-review'

          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true

  inactive-pr-reminder:
    name: Remind on Inactive PRs Needing Review
    runs-on: ubuntu-latest

    steps:
      - name: Find PRs needing attention
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Get open PRs
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const now = new Date();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

            for (const pr of prs.data) {
              const updatedAt = new Date(pr.updated_at);

              // Skip if updated in last 7 days
              if (updatedAt > sevenDaysAgo) continue;

              // Get PR labels
              const labels = pr.labels.map(l => l.name);

              // Skip stale or auto-closed PRs
              if (labels.includes('stale') || labels.includes('auto-closed')) continue;

              // Check if PR has 'needs-review' label and no recent activity
              if (labels.includes('needs-review')) {
                // Get PR comments to check for recent maintainer activity
                const comments = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: pr.number,
                  since: sevenDaysAgo.toISOString()
                });

                // If no recent comments, add a gentle reminder
                if (comments.data.length === 0) {
                  console.log(`Reminding about PR #${pr.number}: ${pr.title}`);

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: `🔔 **Reminder**: This PR is marked as needing review but hasn't had activity in 7+ days.

                    **Maintainers**: Please review when possible
                    **Author (@${pr.user.login})**: Please ensure all checks pass and the PR is ready for review

                    *This is an automated reminder to help prevent PRs from being forgotten.*`
                  });
                }
              }
            }

            console.log('✅ Checked for inactive PRs needing review');

  close-invalid-issues:
    name: Close Invalid or Incomplete Issues
    runs-on: ubuntu-latest

    steps:
      - name: Find and close invalid issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Get recently opened issues
            const threeDaysAgo = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000);

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              since: threeDaysAgo.toISOString(),
              per_page: 100
            });

            for (const issue of issues.data) {
              // Skip PRs
              if (issue.pull_request) continue;

              const labels = issue.labels.map(l => l.name);

              // Check for 'invalid' label that's been there for 3+ days
              if (labels.includes('invalid')) {
                const createdAt = new Date(issue.created_at);
                const daysSinceCreation = (Date.now() - createdAt) / (24 * 60 * 60 * 1000);

                if (daysSinceCreation >= 3) {
                  console.log(`Closing invalid issue #${issue.number}: ${issue.title}`);

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `This issue has been closed because it was marked as invalid.

                    **Why was this closed?**
                    - Marked as invalid for 3+ days
                    - Did not follow issue template
                    - Insufficient information provided
                    - Not a valid bug/feature request

                    **Want to reopen?**
                    Please provide:
                    - Complete issue details following the template
                    - Reproduction steps (for bugs)
                    - Clear use case (for features)
                    - Relevant context and information

                    Feel free to create a new issue with the required information.`
                  });

                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: 'closed',
                    state_reason: 'not_planned'
                  });
                }
              }

              // Check for 'needs-more-info' label that's been there for 14+ days
              if (labels.includes('needs-more-info')) {
                const comments = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: issue.number
                });

                // Find when 'needs-more-info' was first requested
                const labelEvents = await github.rest.issues.listEvents({
                  owner,
                  repo,
                  issue_number: issue.number
                });

                const labeledEvent = labelEvents.data
                  .filter(e => e.event === 'labeled' && e.label?.name === 'needs-more-info')
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

                if (labeledEvent) {
                  const labeledAt = new Date(labeledEvent.created_at);
                  const daysSinceLabeled = (Date.now() - labeledAt) / (24 * 60 * 60 * 1000);

                  if (daysSinceLabeled >= 14) {
                    console.log(`Closing issue needing info #${issue.number}: ${issue.title}`);

                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `This issue has been closed due to insufficient information.

                      **Why was this closed?**
                      - Marked as needing more information 14+ days ago
                      - Required details not provided
                      - Cannot proceed without additional information

                      **Want to reopen?**
                      Please comment with:
                      - The requested information
                      - Additional context or details
                      - Steps to reproduce (for bugs)
                      - Clear requirements (for features)

                      We'll be happy to reopen once the information is provided! 🙏`
                    });

                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issue.number,
                      state: 'closed',
                      state_reason: 'not_planned'
                    });

                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: issue.number,
                      labels: ['insufficient-info']
                    });
                  }
                }
              }
            }

            console.log('✅ Processed invalid and incomplete issues');
