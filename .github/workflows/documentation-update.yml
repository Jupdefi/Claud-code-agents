name: Documentation Update

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '.claude-plugin/marketplace.json'
      - 'plugins/**'
      - '.github/workflows/documentation-update.yml'
      - '.github/scripts/generate-stats.py'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '.claude-plugin/marketplace.json'
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stats:
    name: Update Documentation Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make stats generator executable
        run: chmod +x .github/scripts/generate-stats.py

      - name: Generate statistics
        run: |
          echo "📊 Generating marketplace statistics..."
          python .github/scripts/generate-stats.py --format markdown --output STATS.md
          python .github/scripts/generate-stats.py --format json --output stats.json

      - name: Update README with current stats
        run: |
          echo "📝 Updating README.md with current statistics..."
          python .github/scripts/generate-stats.py --update-readme

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet README.md STATS.md stats.json 2>/dev/null; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No documentation changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ Documentation changes detected"
            git diff --stat README.md STATS.md stats.json
          fi

      - name: Upload statistics artifacts
        if: steps.verify-changes.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-statistics
          path: |
            STATS.md
            stats.json
          retention-days: 90

      - name: Commit and push changes (main branch only)
        if: |
          steps.verify-changes.outputs.changes == 'true' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md STATS.md stats.json
          git commit -m "docs: auto-update marketplace statistics [skip ci]

          Updated by GitHub Actions workflow
          Triggered by: ${{ github.event_name }}
          Commit: ${{ github.sha }}"
          git push

      - name: Comment on PR with statistics
        if: |
          steps.verify-changes.outputs.changes == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const stats = JSON.parse(fs.readFileSync('stats.json', 'utf8'));

            const output = `## 📊 Marketplace Statistics Update

            This PR will update the marketplace statistics:

            ### Totals
            - **Plugins**: ${stats.totals.plugins}
            - **Agents**: ${stats.totals.agents}
            - **Skills**: ${stats.totals.skills}
            - **Commands**: ${stats.totals.commands}
            - **Categories**: ${stats.totals.categories}
            - **Avg Components/Plugin**: ${stats.average_components_per_plugin}

            ### Model Distribution
            ${Object.entries(stats.model_distribution || {})
              .map(([model, count]) => `- **${model}**: ${count} agents`)
              .join('\n')}

            ### Top 5 Plugins by Components
            ${stats.top_plugins.slice(0, 5)
              .map((p, i) => `${i + 1}. **${p.name}**: ${p.components} components`)
              .join('\n')}

            <details>
            <summary>View Full Statistics</summary>

            \`\`\`json
            ${JSON.stringify(stats, null, 2)}
            \`\`\`
            </details>

            ---
            *Statistics auto-generated by documentation-update workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  generate-plugin-list:
    name: Generate Plugin List
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate plugin listing
        run: |
          echo "# Plugin Directory" > PLUGINS.md
          echo "" >> PLUGINS.md
          echo "Auto-generated list of all available plugins." >> PLUGINS.md
          echo "" >> PLUGINS.md

          # Extract plugin information from marketplace.json
          jq -r '.plugins[] | "## \(.name)\n\n**Version**: \(.version)\n**Category**: \(.category)\n\n\(.description)\n\n**Components**:\n- Agents: \(.agents | length)\n- Skills: \(.skills | length)\n- Commands: \(.commands | length)\n\n---\n"' .claude-plugin/marketplace.json >> PLUGINS.md

          echo "✅ Generated PLUGINS.md"

      - name: Upload plugin list
        uses: actions/upload-artifact@v4
        with:
          name: plugin-list
          path: PLUGINS.md
          retention-days: 30

  validate-documentation-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation file references
        run: |
          echo "🔍 Validating documentation links..."

          # Check if all referenced documentation files exist
          MISSING_DOCS=""

          for doc in docs/plugins.md docs/agents.md docs/agent-skills.md docs/usage.md docs/architecture.md; do
            if [ ! -f "$doc" ]; then
              echo "⚠️ Missing documentation file: $doc"
              MISSING_DOCS="${MISSING_DOCS}${doc}\n"
            else
              echo "✅ Found: $doc"
            fi
          done

          if [ -n "$MISSING_DOCS" ]; then
            echo "::warning::Some documentation files are referenced but missing"
          else
            echo "✅ All documentation files exist"
          fi

      - name: Check for broken internal links
        run: |
          echo "🔗 Checking for broken internal links in README..."

          # Simple check for common broken link patterns
          if grep -n "\[.*\](.*\.md)" README.md | grep -v "^#" > /tmp/links.txt; then
            echo "Found markdown links in README:"
            cat /tmp/links.txt

            # Extract file paths and check if they exist
            grep -oP '\[.*?\]\(\K[^)]+\.md' README.md | while read -r link; do
              # Remove any anchors
              file=$(echo "$link" | sed 's/#.*//')
              if [ ! -f "$file" ]; then
                echo "::warning::Potentially broken link to: $file"
              fi
            done
          fi

          echo "✅ Link validation complete"
